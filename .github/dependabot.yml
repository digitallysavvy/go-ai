version: 2
updates:
  # Maintain dependencies for Go modules
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "go"
    ignore:
      # wazero is bumped deliberately, not by dependabot: code mode's qjs
      # sandbox and the fx libfx core (fx-core.wasm) both run on it, and a
      # bump needs the code-mode, qjs and real-core fx suites (v1.9-v1.11
      # panic compiling fx-core.wasm on arm64; v1.12.0 is pinned).
      - dependency-name: "github.com/tetratelabs/wazero"
        versions: [">= 1.10.0"]

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
