name: Support Request
description: Report a bug, feature request or other issue with Go-AI.
labels: ['support']
body:
  - type: markdown
    attributes:
      value: |
        This template is ask for help regarding an issue that could be a bug or a feature request.
  - type: textarea
    attributes:
      label: Description
      description: A detailed description. Please include relevant information such as reproduction steps, code examples, and any other information that might help us understand the issue.
      placeholder: |
        Reproduction steps, code examples, background, etc...
    validations:
      required: true
  - type: textarea
    attributes:
      label: Go-AI Version
      description: Which version of Go-AI are you using?
      placeholder: |
        Examples:
        - github.com/digitallysavvy/go-ai: v0.5.0
        - Go: 1.24.0
        - Provider package/module versions used in your project
    validations:
      required: false
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/digitallysavvy/go-ai/blob/main/CODE_OF_CONDUCT.md)
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
