name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.26', '1.27']
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      # Coverage of the SDK packages (pkg/...), written to the run's Summary page.
      - name: Coverage summary
        if: matrix.go-version == '1.26'
        run: |
          grep -v -E '/(examples|pkg/testutil|pkg/internal/third_party)/' coverage.out > sdk.cov
          total=$(go tool cover -func=sdk.cov | awk '/^total:/ {print $3}')
          {
            echo "## Test coverage: ${total}"
            echo
            echo "SDK packages only (pkg/..., excluding test helpers and vendored code)."
            echo
            echo "<details><summary>Per package</summary>"
            echo
            echo "| Package | Coverage |"
            echo "|---|---|"
            awk 'NR > 1 { split($1, f, ":"); pkg = f[1]; sub("/[^/]*$", "", pkg); t[pkg] += $2; if ($3 > 0) c[pkg] += $2 } END { for (k in t) printf "| %s | %.1f%% |\n", k, 100 * c[k] / t[k] }' sdk.cov | sed 's|github.com/digitallysavvy/go-ai/||' | sort
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Build
        run: go build -v ./...

  build-examples:
    name: Build Examples
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Build examples
        run: ./.github/scripts/build-examples.sh
