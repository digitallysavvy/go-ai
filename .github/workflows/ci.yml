name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      # Pushes the coverage badge JSON to the `badges` branch (main only).
      contents: write
    strategy:
      matrix:
        go-version: ['1.26', '1.27']
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      # The libfx runtime tests boot the real fx-core.wasm. Its pinned version
      # and sha256 come from pin_gen.go, so a pin bump changes the cache key.
      - name: Read the fx-core.wasm pin
        id: fxpin
        run: |
          pin=pkg/harness/fx/internal/libfx/pin_gen.go
          version=$(sed -n 's/^[[:space:]]*Version *= *"\([^"]*\)"/\1/p' "$pin")
          sha256=$(sed -n 's/^[[:space:]]*WasmSHA256 *= *"\([0-9a-f]*\)"/\1/p' "$pin")
          # A pin the patterns no longer match must not share a cache key.
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || ! printf '%s' "$sha256" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "could not read the fx-core.wasm pin from $pin" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      # Only the module is cached: the SDK checks its sha256 on every load.
      # wazero's compilation cache (machine code with only a CRC check) is
      # rebuilt in each run rather than restored.
      - name: Cache fx-core.wasm
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-ai/fx/${{ steps.fxpin.outputs.version }}/fx-core.wasm
          key: fx-wasm-${{ runner.os }}-${{ steps.fxpin.outputs.sha256 }}

      - name: Run tests
        # GOAI_FX_WASM_TEST=1 makes the real fx-core.wasm tests required: they
        # download the pinned module on a cache miss and fail, not skip,
        # when it cannot be prepared.
        env:
          GOAI_FX_WASM_TEST: '1'
        run: go test -v -race -coverprofile=coverage.out ./...

      # Coverage of the SDK packages (pkg/...), written to the run's Summary page.
      - name: Coverage summary
        if: matrix.go-version == '1.26'
        run: |
          grep -v -E '/(examples|pkg/testutil|pkg/internal/third_party)/' coverage.out > sdk.cov
          total=$(go tool cover -func=sdk.cov | awk '/^total:/ {print $3}')
          {
            echo "## Test coverage: ${total}"
            echo
            echo "SDK packages only (pkg/..., excluding test helpers and vendored code)."
            echo
            echo "<details><summary>Per package</summary>"
            echo
            echo "| Package | Coverage |"
            echo "|---|---|"
            awk 'NR > 1 { split($1, f, ":"); pkg = f[1]; sub("/[^/]*$", "", pkg); t[pkg] += $2; if ($3 > 0) c[pkg] += $2 } END { for (k in t) printf "| %s | %.1f%% |\n", k, 100 * c[k] / t[k] }' sdk.cov | sed 's|github.com/digitallysavvy/go-ai/||' | sort
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      # README badge: shields.io reads badges/coverage.json from the `badges` branch.
      - name: Publish coverage badge
        if: matrix.go-version == '1.26' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          pct=$(go tool cover -func=sdk.cov | awk '/^total:/ {sub("%", "", $3); print $3}')
          color=$(awk -v p="$pct" 'BEGIN { print (p >= 80 ? "brightgreen" : p >= 60 ? "yellow" : "orange") }')
          wt="$RUNNER_TEMP/badges"
          if git ls-remote --exit-code --heads origin badges >/dev/null; then
            git fetch -q origin badges
            git worktree add -q -B badges "$wt" FETCH_HEAD
          else
            git worktree add -q --orphan -b badges "$wt"
          fi
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$pct" "$color" > "$wt/coverage.json"
          cd "$wt"
          git add coverage.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "coverage: ${pct}%"
          git push -q origin badges

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned so a new release can't change lint results on unchanged code;
          # bump deliberately (and run it locally) when upgrading.
          version: v2.14.0

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Build
        run: go build -v ./...

      # int is 32 bits on these targets, so an untyped constant above
      # 2^31-1 used as int fails to compile there. vet also compiles the
      # test files, which go build skips.
      - name: Cross-compile and vet for 32-bit (linux/386, linux/arm)
        run: |
          GOOS=linux GOARCH=386 go vet ./...
          GOOS=linux GOARCH=arm go vet ./...

  build-examples:
    name: Build Examples
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Build examples
        run: ./.github/scripts/build-examples.sh
